[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "running-coach"
version = "0.1.0"
description = "MCP server that connects Strava + WHOOP to Claude, with running analytics (pacing, HR, training load, HRV, race prediction)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
running-coach = "running_coach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/running_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
